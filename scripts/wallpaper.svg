<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0a1128"/>
      <stop offset="0.45" stop-color="#141a3a"/>
      <stop offset="0.8" stop-color="#232048"/>
      <stop offset="1" stop-color="#2e1f45"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.28" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#3b5bff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3b5bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.78" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#1f7fd8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#1f7fd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8ecff" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#c9d4ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c9d4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>

  <g filter="url(#soft)">
    <rect width="1600" height="1000" fill="url(#glowA)"/>
    <rect width="1600" height="1000" fill="url(#glowB)"/>
    <rect width="1600" height="1000" fill="url(#glowC)"/>
  </g>

  <circle cx="1240" cy="210" r="120" fill="url(#moon)"/>

  <g fill="#ffffff">
    <circle cx="180" cy="120" r="1.6" opacity="0.8"/>
    <circle cx="420" cy="90" r="1.1" opacity="0.6"/>
    <circle cx="700" cy="160" r="1.4" opacity="0.7"/>
    <circle cx="920" cy="80" r="1" opacity="0.5"/>
    <circle cx="1150" cy="130" r="1.2" opacity="0.6"/>
    <circle cx="300" cy="300" r="1" opacity="0.5"/>
    <circle cx="620" cy="260" r="1.3" opacity="0.65"/>
    <circle cx="880" cy="330" r="1" opacity="0.5"/>
    <circle cx="1080" cy="420" r="1.5" opacity="0.7"/>
    <circle cx="1450" cy="380" r="1.1" opacity="0.55"/>
    <circle cx="150" cy="520" r="1.2" opacity="0.5"/>
    <circle cx="1380" cy="620" r="1.3" opacity="0.5"/>
    <circle cx="260" cy="700" r="1" opacity="0.4"/>
    <circle cx="760" cy="560" r="1.1" opacity="0.45"/>
    <circle cx="560" cy="460" r="0.9" opacity="0.4"/>
    <circle cx="990" cy="640" r="1" opacity="0.4"/>
  </g>
